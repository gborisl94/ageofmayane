name: Build Age of Mayane APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Download game source files
        run: |
          PKG_PATH="core/src/main/java/com/ageofmayane/game"
          ANDROID_PATH="android/src/main/java/com/ageofmayane/game/android"
          mkdir -p "$PKG_PATH"
          mkdir -p "$ANDROID_PATH"

          BASE="https://raw.githubusercontent.com/gborisl94/ageofmayane/${{ github.ref_name }}/templates"

          curl -sL -o "$PKG_PATH/Assets.java"             "$BASE/Assets.java"
          curl -sL -o "$PKG_PATH/Player.java"             "$BASE/Player.java"
          curl -sL -o "$PKG_PATH/Enemy.java"              "$BASE/Enemy.java"
          curl -sL -o "$PKG_PATH/Arrow.java"              "$BASE/Arrow.java"
          curl -sL -o "$PKG_PATH/AgeOfMayaneGame.java"    "$BASE/AgeOfMayaneGame.java"
          curl -sL -o "$ANDROID_PATH/AndroidLauncher.java" "$BASE/AndroidLauncher.java"

          echo "=== Fichiers presents ==="
          find core/src/main/java -name "*.java"
          find android/src/main/java -name "*.java"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: ./gradlew android:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: age-of-mayane-${{ github.ref_name }}-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error